<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sémantický barman</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            background: #14110f;
            color: #f3ece0;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .box {
            width: 100%;
            max-width: 900px;
            background: #1d1916;
            border: 1px solid #3a322b;
            border-radius: 12px;
            overflow: hidden;
        }
        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 18px;
            background: #26211d;
            border-bottom: 1px solid #3a322b;
        }
        h1 { margin: 0; font-size: 1.15rem; }
        .controls-top { display: flex; gap: 10px; align-items: center; }
        .round { color: #e59838; font-weight: 700; font-size: 0.9rem; }
        button {
            padding: 8px 14px;
            border-radius: 8px;
            border: none;
            font-weight: 700;
            cursor: pointer;
        }
        .btn-gold { background: #e59838; color: #16110c; }
        .btn-sec { background: #362f29; color: #f3ece0; }
        button:disabled { opacity: 0.45; cursor: not-allowed; }
        .main {
            display: grid;
            grid-template-columns: 1.3fr 0.9fr;
        }
        @media (max-width: 780px) {
            .main { grid-template-columns: 1fr; }
        }
        canvas {
            display: block;
            width: 100%;
            height: 360px;
            background: #181310;
        }
        .bar-info {
            padding: 10px 16px;
            border-top: 1px solid #3a322b;
            background: #171310;
            font-size: 0.92rem;
        }
        .side {
            padding: 16px;
            border-left: 1px solid #3a322b;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        @media (max-width: 780px) {
            .side { border-left: none; border-top: 1px solid #3a322b; }
        }
        .row { display: flex; gap: 8px; }
        input {
            flex: 1;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #4a4037;
            background: #120f0d;
            color: #fff;
            font-size: 1rem;
        }
        #err { color: #ff7676; font-size: 0.85rem; min-height: 18px; }
        .history {
            max-height: 210px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .h-item {
            display: flex;
            justify-content: space-between;
            padding: 7px 10px;
            border-radius: 6px;
            background: #26211d;
            font-size: 0.88rem;
        }
    </style>
</head>
<body>
<div class="box">
    <div class="top">
        <h1>Sémantický barman</h1>
        <div class="controls-top">
            <span class="round" id="round">Kolo #1</span>
            <button class="btn-sec" id="new-btn" type="button" onclick="newRound()">Nové slovo</button>
        </div>
    </div>

    <div class="main">
        <div>
            <canvas id="c" width="520" height="360"></canvas>
            <div class="bar-info" id="msg">Zadaj slovo a nechaj barmana namiešať drink.</div>
        </div>

        <div class="side">
            <form class="row" onsubmit="event.preventDefault(); guessWord();">
                <input id="inp" type="text" placeholder="Napr. čaj, voda, auto, bager..." autocomplete="off" />
                <button class="btn-gold" id="send-btn" type="submit">Tipnúť</button>
            </form>
            <div id="err"></div>
            <div class="history" id="hist"></div>
        </div>
    </div>
</div>

<script>
const c = document.getElementById("c");
const ctx = c.getContext("2d");

let state = "idle"; // idle | shake | look | drink | bad | mid | good
let t0 = performance.now();
let mood = "idle";
let color = "#e59838";
let fill = 0.7;
let busy = false;
let hist = [];

function setState(s) {
    state = s;
    t0 = performance.now();
}

function drawScene(now) {
    requestAnimationFrame(drawScene);

    const w = c.width;
    const h = c.height;
    const counterY = h * 0.72;
    const dt = (now - t0) / 1000;

    ctx.clearRect(0, 0, w, h);

    // Stena baru
    ctx.fillStyle = "#221b17";
    ctx.fillRect(0, 0, w, counterY);

    // Pult
    ctx.fillStyle = "#6e3f1e";
    ctx.fillRect(0, counterY, w, h - counterY);
    ctx.fillStyle = "#96582c";
    ctx.fillRect(0, counterY, w, 6);

    let bx = w * 0.32;
    let by = counterY;
    let lookX = 0;
    let tilt = 0;
    let sx = w * 0.62;
    let sy = counterY;
    let sRot = 0;

    if (state === "shake") {
        sx = w * 0.62 + Math.sin(dt * 30) * 14;
        sy = counterY - 20 - Math.abs(Math.cos(dt * 22)) * 12;
        sRot = Math.sin(dt * 30) * 0.3;
    } else if (state === "look") {
        lookX = Math.sin(dt * 6) * 8;
    } else if (state === "drink") {
        const p = Math.min(1, dt / 0.35);
        sx = (w * 0.62) * (1 - p) + (bx + 26) * p;
        sy = counterY * (1 - p) + (counterY - 105) * p;
        sRot = -0.8;
        if (dt > 0.3) fill = Math.max(0.15, 0.7 - (dt - 0.3) * 0.8);
    } else if (state === "bad") {
        by = counterY + Math.abs(Math.sin(dt * 9)) * 6;
        tilt = Math.sin(dt * 16) * 0.08;
    } else if (state === "mid") {
        tilt = Math.sin(dt * 4) * 0.04;
    } else if (state === "good") {
        by = counterY - Math.abs(Math.sin(dt * 10)) * 10;
    }

    // Barman (profil otočený doprava)
    ctx.save();
    ctx.translate(bx, by);
    ctx.rotate(tilt);

    // Telo
    ctx.fillStyle = "#2b3440";
    ctx.fillRect(-26, -92, 52, 92);

    // Biela košeľa
    ctx.fillStyle = "#ece5d8";
    ctx.fillRect(4, -92, 18, 65);

    // Ruka
    ctx.fillStyle = "#e6b38a";
    ctx.fillRect(18, -74, 28, 12);

    // Hlava v profile
    ctx.save();
    ctx.translate(lookX, -116);

    ctx.fillStyle = "#e6b38a";
    ctx.beginPath();
    ctx.arc(0, 0, 26, 0, Math.PI * 2);
    ctx.fill();

    // Nos v profile
    ctx.beginPath();
    ctx.moveTo(22, -4);
    ctx.lineTo(34, 2);
    ctx.lineTo(22, 6);
    ctx.closePath();
    ctx.fill();

    // Klobúk
    ctx.fillStyle = "#1b1715";
    ctx.fillRect(-30, -32, 60, 6);
    ctx.fillRect(-18, -54, 36, 22);

    // Oko
    ctx.fillStyle = "#14110f";
    ctx.beginPath();
    ctx.arc(12, -4, 3.2, 0, Math.PI * 2);
    ctx.fill();

    // Ústa podľa nálady
    ctx.strokeStyle = mood === "bad" ? "#76c800" : "#14110f";
    ctx.lineWidth = 3;
    ctx.beginPath();
    if (mood === "good") {
        ctx.arc(10, 8, 8, 0.1 * Math.PI, 0.9 * Math.PI);
    } else if (mood === "bad") {
        ctx.moveTo(8, 13);
        ctx.lineTo(14, 9);
        ctx.lineTo(20, 14);
    } else {
        ctx.moveTo(8, 12);
        ctx.lineTo(20, 12);
    }
    ctx.stroke();

    ctx.restore();
    ctx.restore();

    // Shaker
    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(sRot);

    const lh = 34 * fill;
    ctx.fillStyle = color;
    ctx.fillRect(-14, -4 - lh, 28, lh);

    ctx.strokeStyle = "#e2e8f0";
    ctx.lineWidth = 2.5;
    ctx.strokeRect(-16, -42, 32, 38);

    ctx.fillStyle = "#94a3b8";
    ctx.fillRect(-14, -52, 28, 10);

    ctx.restore();
}

async function newRound() {
    if (busy) return;
    const res = await fetch("/new-game", { method: "POST" });
    const data = await res.json();
    if (res.ok) {
        hist = [];
        renderHist();
        document.getElementById("round").textContent = "Kolo #" + data.round;
        document.getElementById("msg").textContent = "Nové tajné slovo nastavené!";
        mood = "idle";
        color = "#e59838";
        fill = 0.7;
        setState("idle");
    }
}

async function guessWord() {
    if (busy) return;
    const inp = document.getElementById("inp");
    const err = document.getElementById("err");
    const word = inp.value.trim();
    if (!word) return;
    err.textContent = "";

    const res = await fetch("/guess", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ word })
    });
    const data = await res.json();
    if (!res.ok) {
        err.textContent = data.error;
        return;
    }

    busy = true;
    document.getElementById("send-btn").disabled = true;
    document.getElementById("new-btn").disabled = true;
    inp.value = "";

    let nextMood = "mid";
    let nextColor = "#e59838";
    let text = "Hm, taký priemer.";

    if (data.quality < 40) {
        nextMood = "bad";
        nextColor = "#76c800";
        text = "Zelený odvar – úplne mimo!";
    } else if (data.quality >= 75) {
        nextMood = "good";
        nextColor = data.won ? "#ffd166" : "#38bdf8";
        text = data.won ? "Výhra! Trafené tajné slovo!" : "Super tip, blízko cieľa!";
    }

    mood = "idle";
    color = nextColor;
    fill = 0.7;
    setState("shake");
    document.getElementById("msg").textContent = "Pretriasa shaker...";

    setTimeout(() => {
        setState("look");
        document.getElementById("msg").textContent = "Rozhliada sa...";
    }, 900);

    setTimeout(() => {
        setState("drink");
        document.getElementById("msg").textContent = "Napíja sa...";
    }, 1750);

    setTimeout(() => {
        mood = nextMood;
        setState(nextMood);
        document.getElementById("msg").textContent = `${text} (Kvalita ${data.quality}/100, #${data.rank}/${data.total})`;

        hist.unshift({ word: data.word, q: data.quality, r: data.rank });
        renderHist();

        if (data.won && data.next_round_started) {
            setTimeout(() => {
                hist = [];
                renderHist();
                document.getElementById("round").textContent = "Kolo #" + data.round;
                document.getElementById("msg").textContent = "Nové kolo začalo – tipni ďalšie slovo!";
                mood = "idle";
                color = "#e59838";
                fill = 0.7;
                setState("idle");
                busy = false;
                document.getElementById("send-btn").disabled = false;
                document.getElementById("new-btn").disabled = false;
                inp.focus();
            }, 1500);
        } else {
            busy = false;
            document.getElementById("send-btn").disabled = false;
            document.getElementById("new-btn").disabled = false;
            inp.focus();
        }
    }, 2900);
}

function renderHist() {
    document.getElementById("hist").innerHTML = hist.map(x =>
        `<div class="h-item"><strong>${x.word}</strong><span>${x.q}/100 (#${x.r})</span></div>`
    ).join("");
}

requestAnimationFrame(drawScene);
</script>
</body>
</html>

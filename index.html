<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sémantický barman — 3D</title>
    <style>
        :root {
            --bg: #121110;
            --surface: #1b1917;
            --surface-2: #24211e;
            --ink: #f3ede2;
            --muted: #a69c8e;
            --line: #342f2a;
            --accent: #e08a2e;
            --bad: #7bc936;
            --mid: #d9a738;
            --good: #38bdf8;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--ink);
            font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .app {
            width: 100%;
            max-width: 980px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 14px;
            overflow: hidden;
        }

        header {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            justify-content: space-between;
            gap: 12px;
            padding: 16px 22px;
            border-bottom: 1px solid var(--line);
            background: var(--surface-2);
        }

        .brand {
            display: flex;
            align-items: baseline;
            gap: 12px;
        }

        h1 {
            margin: 0;
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        .tag {
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 0.78rem;
            color: var(--muted);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .round-label {
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 0.82rem;
            color: var(--accent);
        }

        .btn-ghost {
            background: transparent;
            color: var(--ink);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 6px 11px;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-ghost:hover:not(:disabled) {
            border-color: #574e45;
            background: rgba(255, 255, 255, 0.03);
        }

        .workspace {
            display: grid;
            grid-template-columns: 1.25fr 0.95fr;
        }

        @media (max-width: 820px) {
            .workspace {
                grid-template-columns: 1fr;
            }
        }

        .viewport-col {
            border-right: 1px solid var(--line);
            display: flex;
            flex-direction: column;
        }

        @media (max-width: 820px) {
            .viewport-col {
                border-right: none;
                border-bottom: 1px solid var(--line);
            }
        }

        #scene-box {
            position: relative;
            width: 100%;
            height: 390px;
            background: #151210;
        }

        #scene-box canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .caption-strip {
            padding: 12px 18px;
            border-top: 1px solid var(--line);
            background: #171513;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        #reaction-text {
            font-size: 0.94rem;
            font-weight: 600;
            color: var(--ink);
        }

        #mix-readout {
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 0.78rem;
            color: var(--muted);
        }

        .panel-col {
            padding: 18px 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .prompt-note {
            margin: 0;
            font-size: 0.88rem;
            line-height: 1.45;
            color: var(--muted);
        }

        .guess-form {
            display: flex;
            gap: 8px;
        }

        input[type="text"] {
            flex: 1;
            min-width: 0;
            padding: 11px 13px;
            font-size: 0.96rem;
            color: var(--ink);
            background: var(--bg);
            border: 1px solid var(--line);
            border-radius: 8px;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--accent);
        }

        .btn-primary {
            padding: 11px 16px;
            font-size: 0.92rem;
            font-weight: 700;
            color: #16120d;
            background: var(--accent);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            white-space: nowrap;
        }

        .btn-primary:hover:not(:disabled) {
            filter: brightness(1.07);
        }

        button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        #error-msg {
            min-height: 18px;
            font-size: 0.82rem;
            color: #f06d6d;
        }

        .log-header {
            display: flex;
            justify-content: space-between;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 0.75rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--line);
        }

        .log-list {
            flex: 1;
            max-height: 215px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .log-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            border-radius: 7px;
            background: var(--surface-2);
            border: 1px solid rgba(255, 255, 255, 0.04);
            font-size: 0.85rem;
        }

        .log-word {
            font-weight: 700;
        }

        .log-sub {
            color: var(--muted);
            font-size: 0.78rem;
        }

        .log-score {
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 0.8rem;
            font-weight: 600;
            white-space: nowrap;
        }
    </style>
</head>
<body>
<div class="app">
    <header>
        <div class="brand">
            <h1>Sémantický barman</h1>
            <span class="tag">3D · kosínusová podobnosť</span>
        </div>
        <div class="header-actions">
            <span class="round-label" id="round-label">Kolo #1</span>
            <button class="btn-ghost" id="new-word-btn" type="button" onclick="manualNewRound()">Nové slovo</button>
        </div>
    </header>

    <div class="workspace">
        <div class="viewport-col">
            <div id="scene-box"></div>
            <div class="caption-strip">
                <div id="reaction-text">Zadaj slovo a barman namieša prvý drink.</div>
                <div id="mix-readout">Čaká na tip · kvalita 0–100</div>
            </div>
        </div>

        <div class="panel-col">
            <p class="prompt-note">
                Tipni slovo. Čím je bližšie vo vektorovom priestore k tajnému slovu, tým lepšie chutí drink. Po uhádnutí sa automaticky otvorí ďalšie kolo.
            </p>

            <form class="guess-form" onsubmit="event.preventDefault(); submitGuess();">
                <input
                    id="word-input"
                    type="text"
                    autocomplete="off"
                    placeholder="Napr. bager, auto, voda, čaj..."
                />
                <button class="btn-primary" id="mix-btn" type="submit">Namiešať</button>
            </form>

            <div id="error-msg"></div>

            <div class="log-header">
                <span>Pokusy v kole</span>
                <span>Skóre / #</span>
            </div>
            <div class="log-list" id="log-list"></div>
        </div>
    </div>
</div>

<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script>
    let logs = [];
    let busy = false;

    // --- 3D scéna (Three.js) ---
    const container = document.getElementById("scene-box");
    const hasThree = typeof window.THREE !== "undefined";

    let scene, camera, renderer;
    let bartenderGroup, headGroup, leftArm, rightArm, shakerGroup, liquidMesh, mouthMesh, leftEye, rightEye;
    let particles = [];
    let animPhase = "idle"; // idle | shake | look | drink | bad | mid | good
    let phaseStart = 0;
    let currentReactionColor = new THREE.Color(0xd98a2b);

    function init3D() {
        if (!hasThree) {
            container.innerHTML = '<div style="padding:24px;color:#a69c8e;font-size:0.9rem;">3D vykresľovanie vyžaduje prístup k Three.js (CDN). Logika hry funguje ďalej.</div>';
            return;
        }

        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x151210);

        const w = container.clientWidth || 520;
        const h = container.clientHeight || 390;
        camera = new THREE.PerspectiveCamera(38, w / h, 0.1, 100);
        camera.position.set(0.3, 1.85, 5.4);
        camera.lookAt(0, 1.35, 0);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(w, h);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // Svetlá
        const ambient = new THREE.AmbientLight(0xfff1dc, 0.75);
        scene.add(ambient);

        const keyLight = new THREE.DirectionalLight(0xffe4bd, 1.5);
        keyLight.position.set(3.2, 5.2, 4.0);
        keyLight.castShadow = true;
        keyLight.shadow.mapSize.set(1024, 1024);
        scene.add(keyLight);

        const rimLight = new THREE.DirectionalLight(0x7ca6d8, 0.65);
        rimLight.position.set(-3.5, 2.5, -2.5);
        scene.add(rimLight);

        // Barový pult (drevená doska + podstavec)
        const counterTop = new THREE.Mesh(
            new THREE.BoxGeometry(5.6, 0.18, 1.8),
            new THREE.MeshStandardMaterial({ color: 0x5c361c, roughness: 0.45, metalness: 0.08 })
        );
        counterTop.position.set(0, 0.85, 0.25);
        counterTop.receiveShadow = true;
        scene.add(counterTop);

        const counterBase = new THREE.Mesh(
            new THREE.BoxGeometry(5.4, 0.9, 1.5),
            new THREE.MeshStandardMaterial({ color: 0x241b16, roughness: 0.8 })
        );
        counterBase.position.set(0, 0.35, 0.25);
        counterBase.receiveShadow = true;
        scene.add(counterBase);

        // 3D Barman
        bartenderGroup = new THREE.Group();
        bartenderGroup.position.set(-0.65, 0.94, -0.15);
        scene.add(bartenderGroup);

        const torsoMat = new THREE.MeshStandardMaterial({ color: 0x2b333d, roughness: 0.55 });
        const apronMat = new THREE.MeshStandardMaterial({ color: 0xe8e0d2, roughness: 0.7 });
        const skinMat = new THREE.MeshStandardMaterial({ color: 0xe6b38a, roughness: 0.6 });
        const hatMat = new THREE.MeshStandardMaterial({ color: 0x1c1816, roughness: 0.4, metalness: 0.15 });
        const bandMat = new THREE.MeshStandardMaterial({ color: 0xc97b28, roughness: 0.4, metalness: 0.3 });

        const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.36, 0.42, 1.05, 24), torsoMat);
        torso.position.y = 0.52;
        torso.castShadow = true;
        bartenderGroup.add(torso);

        const apron = new THREE.Mesh(new THREE.BoxGeometry(0.46, 0.75, 0.12), apronMat);
        apron.position.set(0, 0.45, 0.34);
        apron.castShadow = true;
        bartenderGroup.add(apron);

        const bowTie = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.07, 0.06), bandMat);
        bowTie.position.set(0, 0.98, 0.37);
        bartenderGroup.add(bowTie);

        // Hlava + klobúk + tvár
        headGroup = new THREE.Group();
        headGroup.position.set(0, 1.32, 0);
        bartenderGroup.add(headGroup);

        const head = new THREE.Mesh(new THREE.SphereGeometry(0.31, 28, 28), skinMat);
        head.castShadow = true;
        headGroup.add(head);

        const brim = new THREE.Mesh(new THREE.CylinderGeometry(0.46, 0.46, 0.04, 28), hatMat);
        brim.position.set(0, 0.25, 0);
        brim.castShadow = true;
        headGroup.add(brim);

        const crown = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.26, 0.28, 24), hatMat);
        crown.position.set(0, 0.39, 0);
        crown.castShadow = true;
        headGroup.add(crown);

        const hatBand = new THREE.Mesh(new THREE.CylinderGeometry(0.245, 0.265, 0.05, 24), bandMat);
        hatBand.position.set(0, 0.28, 0);
        headGroup.add(hatBand);

        const eyeMat = new THREE.MeshStandardMaterial({ color: 0x161312, roughness: 0.2 });
        leftEye = new THREE.Mesh(new THREE.SphereGeometry(0.036, 12, 12), eyeMat);
        leftEye.position.set(-0.1, 0.04, 0.29);
        rightEye = new THREE.Mesh(new THREE.SphereGeometry(0.036, 12, 12), eyeMat);
        rightEye.position.set(0.1, 0.04, 0.29);
        headGroup.add(leftEye, rightEye);

        mouthMesh = new THREE.Mesh(
            new THREE.BoxGeometry(0.15, 0.026, 0.03),
            new THREE.MeshStandardMaterial({ color: 0x2a1614, roughness: 0.4 })
        );
        mouthMesh.position.set(0, -0.09, 0.295);
        headGroup.add(mouthMesh);

        // Ruky
        leftArm = new THREE.Mesh(new THREE.CapsuleGeometry(0.08, 0.48, 8, 12), torsoMat);
        leftArm.position.set(-0.46, 0.65, 0.08);
        leftArm.castShadow = true;
        bartenderGroup.add(leftArm);

        rightArm = new THREE.Mesh(new THREE.CapsuleGeometry(0.08, 0.48, 8, 12), torsoMat);
        rightArm.position.set(0.46, 0.65, 0.14);
        rightArm.rotation.x = -0.45;
        rightArm.castShadow = true;
        bartenderGroup.add(rightArm);

        // 3D Shaker na pulte
        shakerGroup = new THREE.Group();
        shakerGroup.position.set(0.55, 0.94, 0.45);
        scene.add(shakerGroup);

        const glassMat = new THREE.MeshPhysicalMaterial({
            color: 0xeef5fc,
            transparent: true,
            opacity: 0.34,
            roughness: 0.1,
            metalness: 0.05,
            transmission: 0.4
        });

        const shakerBody = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.18, 0.56, 24, 1, true), glassMat);
        shakerBody.position.y = 0.28;
        shakerBody.castShadow = true;
        shakerGroup.add(shakerBody);

        const shakerBase = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 0.03, 24), glassMat);
        shakerBase.position.y = 0.015;
        shakerGroup.add(shakerBase);

        const liquidMat = new THREE.MeshStandardMaterial({
            color: 0xd98a2b,
            roughness: 0.25,
            metalness: 0.05
        });
        liquidMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.205, 0.165, 0.36, 24), liquidMat);
        liquidMesh.position.y = 0.20;
        shakerGroup.add(liquidMesh);

        const capMat = new THREE.MeshStandardMaterial({ color: 0xb8c2cc, roughness: 0.25, metalness: 0.8 });
        const shakerCap = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.24, 0.2, 24), capMat);
        shakerCap.position.y = 0.66;
        shakerCap.castShadow = true;
        shakerGroup.add(shakerCap);

        // 3D častice reakcie
        const pGeo = new THREE.OctahedronGeometry(0.055, 0);
        for (let i = 0; i < 14; i++) {
            const pMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 });
            const mesh = new THREE.Mesh(pGeo, pMat);
            mesh.visible = false;
            scene.add(mesh);
            particles.push({
                mesh,
                vel: new THREE.Vector3(),
                life: 0
            });
        }

        window.addEventListener("resize", () => {
            if (!renderer || !camera) return;
            const nw = container.clientWidth || 520;
            const nh = container.clientHeight || 390;
            camera.aspect = nw / nh;
            camera.updateProjectionMatrix();
            renderer.setSize(nw, nh);
        });

        animate3D(performance.now());
    }

    function spawnBurst(colorHex, count = 10) {
        if (!hasThree) return;
        particles.forEach((p, idx) => {
            if (idx < count) {
                p.mesh.visible = true;
                p.mesh.material.color.setHex(colorHex);
                p.mesh.position.set(
                    -0.35 + (Math.random() - 0.5) * 0.9,
                    1.55 + Math.random() * 0.4,
                    0.15 + (Math.random() - 0.5) * 0.4
                );
                p.vel.set(
                    (Math.random() - 0.5) * 1.6,
                    0.9 + Math.random() * 1.4,
                    (Math.random() - 0.5) * 1.2
                );
                p.life = 1.0;
            }

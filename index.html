<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sémantický Barman — The Right Mix Style</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
            background: radial-gradient(circle at 50% 10%, #3b2316 0%, #1c100a 60%, #0e0704 100%);
            color: #fff4e0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 18px;
        }

        .arcade-frame {
            width: 100%;
            max-width: 790px;
            background: #23140c;
            border: 4px solid #d49b35;
            border-radius: 22px;
            padding: 22px 24px 26px;
            box-shadow: 0 22px 60px rgba(0, 0, 0, 0.8), inset 0 0 25px rgba(212, 155, 53, 0.12);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .round-badge {
            background: #3d2415;
            border: 2px solid #d49b35;
            color: #ffd37a;
            font-weight: 700;
            font-size: 0.88rem;
            padding: 4px 12px;
            border-radius: 999px;
        }

        .reset-btn {
            background: #3a2214;
            color: #ffe3ab;
            border: 2px solid #9c6b22;
            border-radius: 10px;
            padding: 5px 12px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
        }

        .reset-btn:hover:not(:disabled) {
            background: #4e2e1b;
        }

        h1 {
            margin: 2px 0 4px;
            text-align: center;
            font-size: 2rem;
            color: #ffcf6e;
            text-shadow: 0 3px 0 #5a2d0c;
        }

        .subtitle {
            margin: 0 0 16px;
            text-align: center;
            color: #e3c89e;
            font-size: 0.96rem;
        }

        /* Barová scéna v štýle klasickej Flash hry */
        .bar-stage {
            position: relative;
            border-radius: 16px;
            border: 3px solid #7a4b21;
            overflow: hidden;
            background: linear-gradient(180deg, #2b170d 0%, #3d2112 63%, #78421b 63%, #592f11 100%);
            padding: 16px 14px 12px;
        }

        .bar-counter-strip {
            position: absolute;
            left: 0;
            right: 0;
            top: 63%;
            height: 10px;
            background: linear-gradient(90deg, #b87433, #e6a357, #b87433);
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.45);
            z-index: 1;
        }

        .speech-box {
            position: relative;
            z-index: 3;
            max-width: 610px;
            margin: 0 auto 8px;
            background: #fff9ec;
            color: #241309;
            border: 2.5px solid #241309;
            border-radius: 14px;
            padding: 9px 16px;
            text-align: center;
            font-weight: 700;
            font-size: 0.98rem;
            box-shadow: 0 4px 0 #241309;
        }

        .scene-area {
            position: relative;
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 32px;
            min-height: 245px;
        }

        svg#barman-svg {
            width: 195px;
            height: 235px;
            overflow: visible;
        }

        svg#shaker-svg {
            width: 120px;
            height: 165px;
            transform-origin: 50% 85%;
            overflow: visible;
        }

        /* Rozhliadnutie doľava a doprava pred pitím */
        .look-around {
            animation: lookLeftRight 1.1s ease-in-out;
        }

        @keyframes lookLeftRight {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        /* Pretrepávanie shakera */
        .shake-mix {
            animation: shakeAction 0.22s ease-in-out 5;
        }

        @keyframes shakeAction {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(-8px, -10px) rotate(-18deg); }
            75% { transform: translate(8px, -10px) rotate(18deg); }
        }

        /* Napitie sa zo shakera */
        .drink-tilt {
            animation: drinkAction 1.25s ease-in-out;
        }

        @keyframes drinkAction {
            0%   { transform: translate(0, 0) rotate(0deg); }
            30%  { transform: translate(-52px, -42px) rotate(-42deg); }
            70%  { transform: translate(-52px, -42px) rotate(-42deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }

        /* Zlá reakcia – grcanie / otrava / otras */
        .anim-sick {
            animation: sickHeave 0.8s ease-in-out;
        }

        @keyframes sickHeave {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(-6px, 8px) rotate(7deg); }
            50% { transform: translate(6px, 12px) rotate(11deg); }
            75% { transform: translate(-4px, 5px) rotate(4deg); }
        }

        /* Neutrálna reakcia – pokrčenie plecami */
        .anim-shrug {
            animation: shrugAnim 0.85s ease-in-out;
        }

        @keyframes shrugAnim {
            0%, 100% { transform: translateY(0) scale(1); }
            45% { transform: translateY(-7px) scale(1.03); }
        }

        /* Dobrá reakcia – rockové / nadšené poskakovanie */
        .anim-rock {
            animation: rockGroove 0.35s ease-in-out 3;
        }

        @keyframes rockGroove {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(-4deg); }
        }

        .fx-pop {
            animation: fxBurst 0.95s ease-out forwards;
        }

        @keyframes fxBurst {
            0%   { opacity: 0; transform: scale(0.65); }
            30%  { opacity: 1; transform: scale(1.06); }
            100% { opacity: 0; transform: scale(1.22); }
        }

        .status-line {
            position: relative;
            z-index: 2;
            margin-top: 8px;
            text-align: center;
            font-size: 0.92rem;
            color: #ffe3a8;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }

        input {
            flex: 1;
            padding: 13px 15px;
            font-size: 1.05rem;
            border-radius: 12px;
            border: 2.5px solid #8c5823;
            background: #140b06;
            color: #fff7e6;
            outline: none;
        }

        input:focus {
            border-color: #ffcf6e;
        }

        button.mix-btn {
            padding: 13px 22px;
            font-size: 1.05rem;
            font-weight: 800;
            border: 2.5px solid #241309;
            border-radius: 12px;
            background: linear-gradient(180deg, #ffd875, #d98c1e);
            color: #241309;
            cursor: pointer;
            box-shadow: 0 3px 0 #241309;
        }

        button.mix-btn:active:not(:disabled) {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #241309;
        }

        button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        #err-msg {
            min-height: 22px;
            color: #ff7b7b;
            font-size: 0.92rem;
            margin-top: 8px;
            text-align: center;
        }

        .log-box {
            margin-top: 14px;
            max-height: 165px;
            overflow-y: auto;
            border-top: 1px solid rgba(255, 227, 168, 0.2);
            padding-top: 10px;
        }

        .log-row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            padding: 7px 12px;
            margin-bottom: 6px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            font-size: 0.91rem;
        }
    </style>
</head>
<body>

<div class="arcade-frame">
    <div class="top-bar">
        <span class="round-badge" id="round-badge">Kolo #1</span>
        <button class="reset-btn" id="new-word-btn" onclick="manualNewRound()">Nové slovo</button>
    </div>

    <h1>Sémantický Barman</h1>
    <p class="subtitle">Namiešaj správny mix pre slovo – barman ho pretrepe, ochutná a ukáže, ako mu sadol.</p>

    <div class="bar-stage">
        <div class="bar-counter-strip"></div>
        <div class="speech-box" id="speech">Zadaj slovo a namiešame prvý drink!</div>

        <div class="scene-area">
            <!-- Barman v retro štýle -->
            <svg id="barman-svg" viewBox="0 0 180 220">
                <g id="barman-group">
                    <!-- Telo / košeľa a traky -->
                    <rect x="46" y="122" width="88" height="82" rx="22" fill="#f5efe2" stroke="#241309" stroke-width="2.5" />
                    <rect x="60" y="122" width="12" height="82" fill="#b52b27" />
                    <rect x="108" y="122" width="12" height="82" fill="#b52b27" />
                    <!-- Motýlik -->
                    <polygon points="90,136 74,129 74,143" fill="#241309" />
                    <polygon points="90,136 106,129 106,143" fill="#241309" />
                    <circle cx="90" cy="136" r="4" fill="#ffcf6e" />

                    <!-- Hlava -->
                    <circle cx="90" cy="82" r="36" fill="#f7c598" stroke="#241309" stroke-width="2.5" />
                    <!-- Vlasy -->
                    <path d="M55 72 Q90 36 125 72 Q114 52 90 52 Q66 52 55 72 Z" fill="#3a2112" />

                    <!-- Oči – bežné -->
                    <g id="eyes-idle">
                        <circle cx="76" cy="79" r="4.5" fill="#241309" />
                        <circle cx="104" cy="79" r="4.5" fill="#241309" />
                    </g>

                    <!-- Oči – zlý mix (krútiace / X) -->
                    <g id="eyes-bad" style="display:none;">
                        <path d="M70 74 L82 84 M82 74 L70 84" stroke="#c9184a" stroke-width="3" stroke-linecap="round" />
                        <path d="M98 74 L110 84 M110 74 L98 84" stroke="#c9184a" stroke-width="3" stroke-linecap="round" />
                    </g>

                    <!-- Oči – super mix -->
                    <g id="eyes-good" style="display:none;">
                        <path d="M70 81 Q76 72 82 81" fill="none" stroke="#241309" stroke-width="3" stroke-linecap="round" />
                        <path d="M98 81 Q104 72 110 81" fill="none" stroke="#241309" stroke-width="3" stroke-linecap="round" />
                    </g>

                    <!-- Ústa -->
                    <path id="mouth" d="M76 98 Q90 101 104 98" fill="none" stroke="#241309" stroke-width="3.2" stroke-linecap="round" />

                    <!-- Efekty okolo barmana (zelené grcanie / hviezdy / otáznik) -->
                    <g id="barman-fx" style="opacity:0;"></g>
                </g>
            </svg>

            <!-- Kokteilový shaker -->
            <svg id="shaker-svg" viewBox="0 0 110 150">
                <defs>
                    <clipPath id="shaker-clip">
                        <polygon points="28,45 82,45 73,128 37,128" />
                    </clipPath>
                </defs>

                <!-- Tekutina vo vnútri -->
                <g clip-path="url(#shaker-clip)">
                    <rect id="shaker-liquid" x="20" y="65" width="70" height="68" fill="#d98c1e" style="transition: y 0.55s ease, fill 0.35s ease;" />
                </g>

                <!-- Telo shakera -->
                <polygon points="28,45 82,45 73,128 37,128" fill="rgba(235, 245, 255, 0.22)" stroke="#f8fafc" stroke-width="3" />
                <!-- Vrchnák shakera -->
                <polygon points="33,45 77,45 68,20 42,20" fill="#cbd5e1" stroke="#241309" stroke-width="2.5" />
                <rect x="47" y="10" width="16" height="11" rx="3" fill="#94a3b8" stroke="#241309" stroke-width="2" />
            </svg>
        </div>

        <div class="status-line" id="status-line">Mix: zatiaľ nenamiešaný</div>
    </div>

    <div class="controls">
        <input id="word-input" type="text" placeholder="Tipni slovo (napr. bager, auto, voda, čaj, espresso)..." onkeypress="if(event.key==='Enter') submitGuess()">
        <button class="mix-btn" id="mix-btn" onclick="submitGuess()">Pretriasť a podať</button>
    </div>
    <div id="err-msg"></div>

    <div class="log-box" id="log-box"></div>
</div>

<script>
    let logs = [];

    function getMixOutcome(quality, won) {
        if (quality < 40) {
            return {
                label: "Zelený žalúdok & grcanie",
                color: "#76c800",
                anim: "anim-sick",
                mood: "bad",
                mouth: "M74 106 Q82 96 90 106 Q98 96 106 106",
                mouthStroke: "#76c800",
                speech: "Bleee! Zelený vývar mi otočil žalúdok naruby – toto fakt nie!",
                fx: `<ellipse cx="90" cy="116" rx="14" ry="8" fill="#76c800" opacity="0.85"/><circle cx="78" cy="126" r="6" fill="#9ef01a" opacity="0.8"/><circle cx="103" cy="128" r="7" fill="#76c800" opacity="0.8"/>`
            };
        }

        if (quality < 75) {
            return {
                label: "Priemerný mix – pokrčenie plecami",
                color: "#f59e0b",
                anim: "anim-shrug",
                mood: "idle",
                mouth: "M76 100 L104 100",
                mouthStroke: "#241309",
                speech: "Hm... taký nijaký mix. Niečo tam je, ale ešte to nie je ono.",
                fx: `<text x="128" y="54" fill="#ffd37a" font-size="22" font-weight="bold">?</text>`
            };
        }

        return {
            label: won ? "Perfektný mix – absolútna trefa!" : "Výborný mix – skvelá chuť!",
            color: won ? "#ffd166" : "#38bdf8",
            anim: "anim-rock",
            mood: "good",
            mouth: "M70 94 Q90 115 110 94",
            mouthStroke: "#241309",
            speech: won
                ? "JÓÓ! Presne ten správny mix! Chystám nové tajné slovo..."
                : "Paráda! Tohle už má grády – sme veľmi blízko cieľu!",
            fx: `<text x="22" y="52" fill="#ffd166" font-size="20">♪</text><text x="142" y="48" fill="#ffd166" font-size="20">★</text><text x="82" y="20" fill="#ffe39f" font-size="18">✦</text>`
        };
    }

    function setBarmanMood(mood, mouthD, mouthStroke, fxHtml) {
        document.getElementById("eyes-idle").style.display = mood === "idle" ? "block" : "none";
        document.getElementById("eyes-bad").style.display = mood === "bad" ? "block" : "none";
        document.getElementById("eyes-good").style.display = mood === "good" ? "block" : "none";

        const mouth = document.getElementById("mouth");
        mouth.setAttribute("d", mouthD);
        mouth.setAttribute("stroke", mouthStroke);

        const fx = document.getElementById("barman-fx");
        fx.innerHTML = fxHtml;
        fx.style.opacity = "1";
        fx.classList.remove("fx-pop");
        void fx.offsetWidth;
        fx.classList.add("fx-pop");
    }

    function resetRoundUI(roundNum, msg) {
        logs = [];
        renderLogs();
        document.getElementById("round-badge").textContent = `Kolo #${roundNum}`;
        document.getElementById("status-line").textContent = "Mix: zatiaľ nenamiešaný";
        document.getElementById("shaker-liquid").setAttribute("y", "65");
        setBarmanMood("idle", "M76 98 Q90 101 104 98", "#241309", "");
        document.getElementById("speech").textContent = msg;
    }

    async function manualNewRound() {
        const btn = document.getElementById("new-word-btn");
        btn.disabled = true;
        try {
            const res = await fetch("/new-game", { method: "POST" });
            const data = await res.json();
            if (res.ok) {
                resetRoundUI(data.round, "Nové tajné slovo nastavené! Poďme namiešať ďalší drink.");
            }
        } finally {
            btn.disabled = false;
        }
    }

    async function submitGuess() {
        const input = document.getElementById("word-input");
        const mixBtn = document.getElementById("mix-btn");
        const newWordBtn = document.getElementById("new-word-btn");
        const errMsg = document.getElementById("err-msg");
        const word = input.value.trim();

        if (!word) return;
        errMsg.textContent = "";

        try {
            const res = await fetch("/guess", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ word })
            });
            const data = await res.json();

            if (!res.ok) {
                errMsg.textContent = data.error;
                return;
            }

            mixBtn.disabled = true;
            newWordBtn.disabled = true;
            input.value = "";

            const outcome = getMixOutcome(data.quality, data.won);
            const shaker = document.getElementById("shaker-svg");
            const liquid = document.getElementById("shaker-liquid");
            const barmanGroup = document.getElementById("barman-group");
            const speech = document.getElementById("speech");
            const statusLine = document.getElementById("status-line");

            // 1. Naplnenie a pretrepávanie shakera
            liquid.setAttribute("fill", outcome.color);
            liquid.setAttribute("y", "56");
            statusLine.textContent = `Mix: ${outcome.label} | Skóre: ${data.quality}/100 | Poradie #${data.rank}/${data.total}`;
            speech.textContent = "Pretrepávam shaker...";

            shaker.classList.remove("shake-mix", "drink-tilt");
            void shaker.offsetWidth;
            shaker.classList.add("shake-mix");

            // 2. Barman sa rozhliadne doľava a doprava
            setTimeout(() => {
                speech.textContent = "Barman sa obzerá doľava a doprava...";
                barmanGroup.classList.remove("look-around", "anim-sick", "anim-shrug", "anim-rock");
                void barmanGroup.offsetWidth;
                barmanGroup.classList.add("look-around");
            }, 1150);

            // 3. Napitie sa zo shakera
            setTimeout(() => {
                speech.textContent = "Ochutnáva mix...";
                shaker.classList.remove("shake-mix");
                void shaker.offsetWidth;
                shaker.classList.add("drink-tilt");

                setTimeout(() => {
                    liquid.setAttribute("y", "112");
                }, 400);
            }, 2300);

            // 4. Reakcia po dopití
            setTimeout(() => {
                barmanGroup.classList.remove("look-around", "anim-sick", "anim-shrug", "anim-rock");
                void barmanGroup.offsetWidth;
                barmanGroup.classList.add(outcome.anim);

                setBarmanMood(outcome.mood, outcome.mouth, outcome.mouthStroke, outcome.fx);
                speech.textContent = outcome.speech;

                logs.unshift({
                    word: data.word,
                    label: outcome.label,
                    quality: data.quality,
                    rank: data.rank
                });
                renderLogs();

                if (data.won && data.next_round_started) {
                    setTimeout(() => {
                        resetRoundUI(
                            data.round,
                            `Trafené slovo „${data.word}“! Začína Kolo #${data.round} s novým tajným slovom.`
                        );
                        mixBtn.disabled = false;
                        newWordBtn.disabled = false;
                        input.focus();
                    }, 1700);
                } else {
                    mixBtn.disabled = false;
                    newWordBtn.disabled = false;
                    input.focus();
                }
            }, 3600);

        } catch (e) {
            errMsg.textContent = "Chyba komunikácie so serverom.";
            mixBtn.disabled = false;
            newWordBtn.disabled = false;
        }
    }

    function renderLogs() {
        const el = document.getElementById("log-box");
        el.innerHTML = logs.map(item => `
            <div class="log-row">
                <span><strong>${item.word}</strong> — ${item.label}</span>
                <span><strong>${item.quality}/100</strong> (#${item.rank})</span>
            </div>
        `).join("");
    }
</script>

</body>
</html>
